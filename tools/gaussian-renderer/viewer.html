<!DOCTYPE html>
<meta charset="utf-8" />

<title>GaussVol viewer</title>
<style>
    body {margin: 0; background: #111; color: #ddd; font: 14px monospace;}
    #info { margin: 8px; white-space: pre-wrap;}
    /* panel on the left, canvas on the right */
    #main { display: flex; gap: 8px; align-items: flex-start; }
    #panel { width: 220px; flex: none; padding: 0 8px; }
    .row { display: flex; justify-content: space-between; gap: 8px; margin: 6px 0; }
    select { background: #222; color: #ddd; border: 1px solid #555; font: inherit; }
    /* canvas: renders 1024 x 1024 but is shown smaller to fit next to the panel (4em = room for the status line) */
    /* height auto keeps it square, grey outline shows where it is */
    #view { display: block; width: min(calc(100vw - 240px), calc(100vh - 4em)); height: auto; outline: 1px solid #444; }
</style>

<pre id="info">loading viewer.js...</pre>
<div id="main">
  <!-- controls, filled by viewer.ts from the presets -->
  <div id="panel"></div>
  <!-- drawing surface, width/height = real pixel size of the image -->
  <canvas id="view" width="1024" height="1024"></canvas>
</div>
<script src="/dist/viewer.js"></script>
